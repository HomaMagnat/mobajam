<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBKA</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>

<style>
*{
    /*outline: 1px solid red;*/
}

:root {
--border: #000000; /* gradient border bg */
--border2: #000000; /* gradient border second bg */
--borderlight: #000000; /* top */
--borderdark: #000000; /* bottom */

--main: #000000; /* gradient content bg */
--main2: #000000; /* gradient content second bg */
--innershadow: #000000; /* content inner shadow */
}

:root {
  --border: #e0aa5b;
  --border2: #5b3717;
  --borderlight: #f4c878;
  --borderdark: #6b4018;

  --main: #17181c;
  --main2: #07080a;
  --innershadow: rgba(0, 0, 0, 0.85);
}


:root {
  --border: #123b4b;
  --border2: #0e2030;
  --borderlight: #20444e;
  --borderdark: #050b12;

  --main: #0c1922;
  --main2: #09141b;
  --innershadow: #03080d;
}


:root {
  --border: #262744;      /* gradient border bg */
  --border2: #110d24;     /* gradient border second bg */
  --borderlight: #2c3146; /* top */
  --borderdark: #07070F;  /* bottom */

  --main: #111125;        /* gradient content bg */
  --main2: #05070F;       /* gradient content second bg */
  --innershadow: #00000e; /* content inner shadow */
}


html, body {
margin: 0;
padding: 0;
height: 100%;
width: 100%;
overflow: hidden;
background: black;
color: white;
font-weight: normal;
font-family: "Fira Sans", sans-serif;
user-select: none;
}

.gametitle {
position: absolute;
top: 40px;
right: 0;
left: 0;
margin: auto;
width: 500px;
text-align: center;
padding: 10px;
font-weight: bold;
font-size: 60px;
background: blue;
}

.roomlist {
position: absolute;
top: 200px;
left: 50px;
width: 35%;
height: calc(100% - 480px);
padding: 20px;
clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.roomlist::before {
content: '';
position: absolute;
inset: 10px;
clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
z-index: -1;

background: linear-gradient(var(--main), var(--main2));
box-shadow: 0 0 30px 5px var(--innershadow) inset;
}

.rooms {
width: 100%;
height: 100%;
overflow-y: scroll;
}

.room {
padding: 10px;
margin-bottom: 10px;
clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);

background: linear-gradient(var(--border2), var(--main));
border-top: 2px solid var(--border);
border-bottom: 2px solid var(--borderdark);
box-shadow: 0 0 10px 5px #000000;
}

.roomname {
display: inline-block;
padding: 5px 10px 5px 10px;
font-size: 30px;
width: calc(100% - 260px);
}
.roomplayers {
display: inline-block;
padding: 5px 10px 5px 10px;
font-size: 30px;
width: 80px;
text-align: center;
}
.login {
display: inline-block;
padding: 5px 10px 5px 10px;
font-size: 30px;
width: 120px;
text-align: center;

clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);

background: linear-gradient(#0c3547, #052b40);
border-top: 2px solid #04799a;
border-bottom: 2px solid #073e53;
box-shadow: 0 0 10px 5px #000000;
}

.createlobby {
position: absolute;
width: calc(100% - 20px);
padding: 10px;
text-align: center;
bottom: -80px;
left: 0px;
font-size: 30px;
}

.matchmaking {
position: absolute;
bottom: 40px;
right: 50px;
font-weight: bold;
font-size: 70px;
padding: 5px 20px 5px 20px;
width: 20%;
min-width: 250px;
text-align: center;
}

.nickname {
position: absolute;
bottom: 50px;
right: 0;
left: 0;
margin: auto;
font-size: 40px;
font-family: "Fira Sans", sans-serif;
padding: 10px 20px 10px 20px;
width: 400px;
text-align: center;
}

.playerpreview {
position: absolute;
right: 50px;
}
</style>

<body>
    <div class="mainmenu">
        <div class="gametitle">MobaJam</div>

        <div class="roomlist">
            <div class="rooms">
            
            </div>
            <div class="createlobby">СОЗДАТЬ ЛОББИ</div>
        </div>

        <div class="playerpreview">ПЕРСЮК</div>

        <input class="nickname" placeholder="Ваш никнейм">
        <div class="matchmaking">ИГРАТЬ</div>
    </div>

    <div class="lobby" style="display: none;">
        <div class="blueteam">
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
        </div>

        <div class="middledata">
            <div class="dataline">Название лобби: <div class="thisroomname"></div></div>
            <div class="dataline">Игроки: <div class="thisroomplayers"></div></div>
        </div>

        <div class="redteam">
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
        </div>

        <div class="startgame">В ИГРУ <span id="playervotes"></span></div>
    </div>

    <div class="gameui" style="display: none;">
    </div>

    <canvas id="canvas" style="display: none;"></canvas>
    
    <script type="module" src="src/main.js"></script>

</body>

</html>
