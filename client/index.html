<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBKA</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Vollkorn:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>

<style>
*{
    /*outline: 1px solid red;*/
}

:root {
--border: #000000; /* gradient border bg */
--border2: #000000; /* gradient border second bg */
--borderlight: #000000; /* top */
--borderdark: #000000; /* bottom */

--main: #000000; /* gradient content bg */
--main2: #000000; /* gradient content second bg */
--innershadow: #000000; /* content inner shadow */
}

:root {
  --border: #e0aa5b;
  --border2: #5b3717;
  --borderlight: #f4c878;
  --borderdark: #6b4018;

  --main: #17181c;
  --main2: #07080a;
  --innershadow: rgba(0, 0, 0, 0.85);
}


:root {
  --border: #123b4b;
  --border2: #0e2030;
  --borderlight: #20444e;
  --borderdark: #050b12;

  --main: #0c1922;
  --main2: #09141b;
  --innershadow: #03080d;
}


:root {
  --border: #262744;      /* gradient border bg */
  --border2: #110d24;     /* gradient border second bg */
  --borderlight: #2c3146; /* top */
  --borderdark: #07070F;  /* bottom */

  --main: #111125;        /* gradient content bg */
  --main2: #04050e;       /* gradient content second bg */
  --innershadow: #060411; /* content inner shadow */
}


html, body {
margin: 0;
padding: 0;
height: 100%;
width: 100%;
overflow: hidden;
background: url(https://cdn.discordapp.com/attachments/1246825599713148992/1540841794412093570/image.png?ex=6a8b6c3f&is=6a8a1abf&hm=9026eebca32200e3f91bc266ab41e3adfc2ecadd3901dc5d949c98f706a6632b&) no-repeat;
background-size: cover;
background-position: right center;
color: white;
font-weight: normal;
font-family: "Fira Sans", sans-serif;
user-select: none;
}

.gtwrapper {
position: absolute;
top: 40px;
right: 0;
left: 0;
margin: auto;
width: 500px;
filter: drop-shadow(0px 0px 8px #000000a6);
}

.gametitle {
text-align: center;
padding: 20px;
font-weight: bold;
font-size: 60px;

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
text-shadow: 0 0 5px white;

clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);
clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
}
.gametitle::before {
content: '';
position: absolute;
inset: 10px;
z-index: -1;
clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);

background: linear-gradient(#231479, #0a0827);
border-top: 2px solid #3017a1;
border-bottom: 2px solid #07031b;

background: linear-gradient(#363886, #0d0e30);
  border-top: 2px solid #40439c;
  border-bottom: 2px solid #0c0c18;

/*background: linear-gradient(var(--main), var(--main2));
box-shadow: 0 0 30px 5px var(--innershadow) inset;*/
}

.rlwrapper {
position: absolute;
top: 200px;
left: 50px;
width: calc(35% + 40px);
height: calc(100% - 440px);
filter: drop-shadow(0px 0px 5px #00000094);
}
.roomlist {
position: absolute;
width: calc(100% - 40px);
height: calc(100% - 40px);
padding: 20px;

clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.roomlist::before {
content: '';
position: absolute;
inset: 10px;
clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
z-index: -1;

background: linear-gradient(var(--main), var(--main2));
box-shadow: 0 0 30px 5px var(--innershadow) inset;
}

.rooms {
width: 100%;
height: 100%;
overflow-y: scroll;
}

.room {
padding: 10px;
margin-bottom: 10px;
clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
box-shadow: 0 0 10px 5px #000000;
}

.roomname {
display: inline-block;
padding: 5px 10px 5px 10px;
font-size: 30px;
width: calc(100% - 260px);
}
.roomplayers {
display: inline-block;
padding: 5px 10px 5px 10px;
font-size: 30px;
width: 80px;
text-align: center;
}
.login {
display: inline-block;
padding: 7px 10px 5px 10px;
font-size: 25px;
font-weight: 500;
width: 120px;
text-align: center;
cursor: pointer;

clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);

background: linear-gradient(#145779, #081c27);
border-top: 2px solid #1771a1;
border-bottom: 2px solid #03131b;
}

.createlobby {
position: absolute;
width: 300px;
top: calc(100% - 210px);
left: 13%;
padding: 10px;
text-align: center;
font-size: 28px;
font-weight: 500;
cursor: pointer;

clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);

background: linear-gradient(#145779, #081c27);
border-top: 2px solid #1771a1;
border-bottom: 2px solid #03131b;
}

.mmwrapper {
position: absolute;
bottom: 40px;
right: 50px;
font-weight: bold;
font-size: 70px;
width: 20%;
min-width: 250px;
text-align: center;
cursor: pointer;
filter: drop-shadow(0px 0px 8px black);
text-shadow: 0 0 5px white;
}
.matchmaking {
padding: 15px 20px 15px 20px;

clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.matchmaking::before {
content: '';
position: absolute;
inset: 10px;
z-index: -1;
clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);

background: linear-gradient(#791414, #270808);
border-top: 2px solid #a11717;
border-bottom: 2px solid #1b0303;
}

.nnwrapper {
position: absolute;
bottom: 50px;
right: 0;
left: 0;
width: 420px;
margin: auto;
text-align: center;
filter: drop-shadow(0px 0px 6px black);
}
.nicknamebox {
padding: 10px;
width: 400px;

clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.nickname {
color: white;
font-size: 40px;
font-family: "Fira Sans", sans-serif;
text-align: center;
outline: none;
border: none;
padding: 10px 20px 10px 20px;
width: 360px;

clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);

background: var(--main2);
box-shadow: 0 0 30px 5px var(--innershadow) inset;
transition: background 1s ease;
}

.input-error {
background: #962a2a;
transition: none !important; 
}

.playerpreview {
position: absolute;
right: 29%;
bottom: 40%;
}

.btwrapper {
position: absolute;
top: 100px;
left: 50px;
width: calc(30% + 40px);
height: calc(100% - 300px);
filter: drop-shadow(0px 0px 5px #00000094);
}
.blueteam {
position: absolute;
width: calc(100% - 40px);
height: calc(100% - 40px);
padding: 10px 20px 20px 20px;

clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.blueteam::before {
content: '';
position: absolute;
inset: 10px;
clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
z-index: -1;

background: linear-gradient(var(--main), var(--main2));
box-shadow: 0 0 30px 5px var(--innershadow) inset;
}

.rtwrapper {
position: absolute;
top: 100px;
right: 50px;
width: calc(30% + 40px);
height: calc(100% - 300px);
filter: drop-shadow(0px 0px 5px #00000094);
}
.redteam {
position: absolute;
width: calc(100% - 40px);
height: calc(100% - 40px);
padding: 10px 20px 20px 20px;

clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px), 0 20px);

background: linear-gradient(var(--border), var(--border2));
border-top: 2px solid var(--borderlight);
border-bottom: 2px solid var(--borderdark);
}
.redteam::before {
content: '';
position: absolute;
inset: 10px;
clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
z-index: -1;

background: linear-gradient(var(--main), var(--main2));
box-shadow: 0 0 30px 5px var(--innershadow) inset;
}

.playerslot {
width: 100%;
height: calc(20% - 10px);
margin-top: 10px;
background: red;
}
</style>

<body>
    <div class="mainmenu" style="display: none;">
        <div class="gtwrapper"><div class="gametitle">MobaJam</div></div>

        <div class="rlwrapper"><div class="roomlist">
            <div class="rooms">
            </div>
        </div></div>

        <div class="createlobby" data-action="createroom">СОЗДАТЬ ЛОББИ</div>

        <div class="playerpreview">ПЕРСЮК</div>

        <div class="nnwrapper"><div class="nicknamebox"><input class="nickname" placeholder="Ваш никнейм" maxlength="12"></div></div>
        <div class="mmwrapper"><div class="matchmaking" data-action="matchmaking">ИГРАТЬ</div></div>
    </div>

    <div class="lobby">
        <div class="btwrapper">
        <div class="blueteam">
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
        </div>
        </div>

        <div class="middledata">
            <div class="lobbytime"></div>
            <div class="dataline">Название лобби: ЛОББИ #<div class="thisroomname"></div></div>
            <div class="dataline">Игроки: <div class="thisroomplayers"></div></div>
        </div>

        <div class="rtwrapper">
        <div class="redteam">
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
            <div class="playerslot"></div>
        </div>
        </div>

        <div class="ready" data-action="ready">ГОТОВ <span id="playervotes"></span></div>
    </div>

    <div class="gameui" style="display: none;">
    </div>

    <canvas id="canvas" style="display: none;"></canvas>
    
    <script type="module" src="src/main.js"></script>

</body>

</html>
